name: Actualizar lista IPTV

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "build_list.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar la lista
        run: python build_list.py

      - name: Guardar la lista actualizada (commit)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lista.m3u
          git diff --staged --quiet || git commit -m "Actualizacion automatica de la lista"
          git push
