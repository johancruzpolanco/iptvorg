name: Actualizar lista IPTV

# Cuando se ejecuta:
on:
  # 1) Automaticamente cada 12 horas (a las 00:00 y 12:00 UTC)
  schedule:
    - cron: "0 */12 * * *"
  # 2) Manualmente desde la pestana Actions de GitHub (boton "Run workflow")
  workflow_dispatch:
  # 3) Cada vez que edites el script o el workflow
  push:
    branches: [ main ]
    paths:
      - "build_list.py"
      - ".github/workflows/update.yml"

# Permisos para que la accion pueda hacer commit del archivo generado
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar la lista
        run: python build_list.py

      - name: Guardar la lista actualizada (commit)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lista.m3u
          # Solo hace commit si hubo cambios reales
          git diff --staged --quiet || git commit -m "Actualizacion automatica de la lista"
          git push
